[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movens-interact"
version = "0.1.0"
description = "Body and hand action experts for humanoid manipulation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.57.6",
    "diffusers==0.37.0",
    "accelerate>=1.0,<2",
    "numpy==1.26.4",
    "safetensors>=0.6,<1",
    "huggingface-hub>=0.34,<1",
    "pillow>=10,<13",
    "librosa>=0.10.2,<0.12",
]

[project.optional-dependencies]
train = ["pyarrow>=16,<22", "scipy>=1.10,<2", "mujoco==3.7.0"]
sim = ["scipy>=1.10,<2", "mujoco==3.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["movens_interact*", "training*", "inference*", "simulation*"]

[tool.setuptools]
include-package-data = true
